name: Container verification
on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Image metadata
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          version=$(node -p "require('./hasswright/app/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=ghcr.io/${OWNER,,}/${{ matrix.arch }}-hasswright:$version" >> "$GITHUB_OUTPUT"
      - name: Build the actual add-on image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./hasswright
          platforms: ${{ matrix.platform }}
          load: true
          tags: ${{ steps.image.outputs.name }}
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.image.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Verify startup, assets, and data across container replacement
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          task_data_dir="${RUNNER_TEMP}/hasswright-smoke-data"
          mkdir -p "$task_data_dir"
          start_app() {
            docker run -d --name hasswright-smoke -p 127.0.0.1:18099:8099 \
              --mount "type=bind,source=$task_data_dir,target=/data" \
              -e HASSWRIGHT_DEMO_FIXTURE=1 "$IMAGE"
            curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 \
              http://127.0.0.1:18099/api/health > /tmp/hasswright-health.json
          }
          start_app
          jq -e --arg version "$VERSION" '.ok == true and .mode == "observe" and .version == $version' /tmp/hasswright-health.json
          curl --fail --silent http://127.0.0.1:18099/ | grep -q 'build/app.js'
          curl --fail --silent http://127.0.0.1:18099/build/app.js -o /tmp/hasswright-app.js
          test -s /tmp/hasswright-app.js
          session_id=$(curl --fail --silent -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:18099/api/sessions | jq -r .session.id)
          test "$session_id" != null
          docker rm -f hasswright-smoke
          start_app
          curl --fail --silent "http://127.0.0.1:18099/api/sessions/$session_id" | jq -e --arg id "$session_id" '.session.id == $id'
          docker rm -f hasswright-smoke
      - name: Container logs on failure
        if: failure()
        run: docker logs hasswright-smoke || true
      - name: Registry login
        if: inputs.publish
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified architecture image
        if: inputs.publish
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: docker push "$IMAGE"
