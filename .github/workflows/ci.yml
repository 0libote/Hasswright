name: ci
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
        working-directory: hasswright/app
      - run: npm run build
        working-directory: hasswright/app
      - run: npm test
        working-directory: hasswright/app
