name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: hasswright-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate release version and packaging
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: npm run check:packaging
      - run: npm run build && npm test
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to replace an already published version
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          version=$(node -p "require('./hasswright/app/package.json').version")
          if docker buildx imagetools inspect "ghcr.io/${OWNER,,}/hasswright:$version" >/dev/null 2>&1; then
            echo "Version $version is already published. Bump the add-on version before releasing again."
            exit 1
          fi
  images:
    needs: validate
    uses: ./.github/workflows/containers.yml
    with:
      publish: true
  manifest:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and verify the versioned multi-arch manifest
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          version=$(node -p "require('./hasswright/app/package.json').version")
          registry="ghcr.io/${OWNER,,}"
          docker buildx imagetools create --tag "$registry/hasswright:$version" \
            "$registry/amd64-hasswright:$version" "$registry/aarch64-hasswright:$version"
          docker buildx imagetools inspect "$registry/hasswright:$version"
