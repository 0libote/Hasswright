name: Hasswright
version: "0.1.3"
slug: hasswright
description: "Hasswright — Your home. Understood. AI engineering agent for Home Assistant."
url: https://github.com/0libote/Hasswright
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
stage: experimental
ports:
  "8099/tcp": null
ingress: true
ingress_port: 8099
panel_title: Hasswright
panel_icon: mdi:home-wrench
homeassistant_api: true
hassio_api: true
hassio_role: manager
auth_api: false
map:
  - type: homeassistant_config
    read_only: true
  - type: backup
    read_only: false
  - type: share
    read_only: false
  - type: ssl
    read_only: true
  - type: data
    path: /data
options:
  log_level: info
  opencode_base_url: ""
  codex_enabled: false
  mode: observe
schema:
  log_level: list(info|debug|warning|error)
  opencode_base_url: str?
  codex_enabled: bool?
  mode: list(observe|assist|managed)
environment:
  HASSWRIGHT_DATA_DIR: /data
  HASSWRIGHT_PORT: "8099"
watchdog: http://[HOST]:[PORT:8099]/api/health
backup: hot
backup_exclude:
  - "*.log"
  - node_modules/*
timeout: 30
